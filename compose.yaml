name: odo

services:
  db:
    container_name: odo-db
    image: postgis/postgis:18-3.7
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odo}
      POSTGRES_USER: ${POSTGRES_USER:-odo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odo}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    container_name: odo-mailpit
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  valhalla:
    container_name: odo-valhalla
    image: ghcr.io/valhalla/valhalla-scripted:3.9.2
    environment:
      tile_urls: ${VALHALLA_TILE_URL:-https://download.geofabrik.de/europe/belarus-latest.osm.pbf}
      build_elevation: ${VALHALLA_BUILD_ELEVATION:-False}
      server_threads: ${VALHALLA_SERVER_THREADS:-2}
    ports:
      - "127.0.0.1:${VALHALLA_PORT:-8002}:8002"
    volumes:
      - valhalla_data:/custom_files
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/status"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10m

volumes:
  postgres_data:
  valhalla_data:
